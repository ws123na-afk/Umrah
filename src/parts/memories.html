.mem-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:0 auto;padding:6px 0 18px}
.mem-stage{-webkit-perspective:900px;perspective:900px;width:100%;margin:0}

.mem-photo{position:relative;display:block;width:100%;height:0;padding-top:133.3333%;overflow:hidden;border-radius:2px;background:var(--mem-night);box-shadow:inset 0 0 0 1px rgba(4,32,26,.5)}

  // Seamless loop: duplicate each set once (clones hidden from AT and keyboard).
  for (i = 0; i < sets.length; i++) {
    var dup = sets[i].cloneNode(true);
    dup.className += ' mem-dup';
    dup.setAttribute('aria-hidden', 'true');
    var f = dup.querySelectorAll('button');
    for (j = 0; j < f.length; j++) { f[j].setAttribute('tabindex', '-1'); }
    sets[i].parentNode.appendChild(dup);
  }

  // Reuse the single embedded photo for the tile imgs (avoids repeating the base64 payload).
  var src = img ? img.getAttribute('src') : '';
  var tiles = root.querySelectorAll('img[data-mem-src]');
  for (i = 0; i < tiles.length; i++) { tiles[i].setAttribute('src', src); }

  // Lightbox
  var lastFocus = null;
  var prevOverflow = '';
  var lbCap = lb.querySelector('.mem-lb-cap');
  function openLb(from) {
    lastFocus = from || null;
    var im = from && from.querySelector ? from.querySelector('img') : null;
    var cap = from && from.getAttribute ? from.getAttribute('data-cap') : null;
    lbImg.setAttribute('src', im && im.getAttribute('src') ? im.getAttribute('src') : src);
    if (lbCap) { lbCap.textContent = cap || T('حرمِ مکی، خانہ کعبہ کے سامنے'); }
    lbImg.setAttribute('alt', cap || T('سفرِ عمرہ کی یاد'));
    lb.className = 'mem-lb mem-open';
    prevOverflow = document.documentElement.style.overflow;
    document.documentElement.style.overflow = 'hidden';
    try { lbX.focus(); } catch (e) {}
  }
  function closeLb() {
    if (lb.className.indexOf('mem-open') < 0) { return; }
    lb.className = 'mem-lb';
    document.documentElement.style.overflow = prevOverflow;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  feat.addEventListener('click', function () { openLb(feat); });
  root.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== root) {
      if (t.getAttribute && t.getAttribute('data-mem-open')) { openLb(t); return; }
      t = t.parentNode;
    }
  });
  lbX.addEventListener('click', function (e) { e.stopPropagation(); closeLb(); });
  lb.addEventListener('click', function (e) { if (e.target !== lbImg) { closeLb(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.keyCode === 27) { closeLb(); }
  });

  // Pause marquees while touched
  var marqs = root.querySelectorAll('.mem-marq');
  function holdOn(m) { if (m._memT) { clearTimeout(m._memT); m._memT = 0; } m.className = m.className.replace(/\s*mem-hold/g, '') + ' mem-hold'; }
  function holdOff(m) { if (m._memT) { clearTimeout(m._memT); } m._memT = setTimeout(function () { m.className = m.className.replace(/\s*mem-hold/g, ''); m._memT = 0; }, 700); }
  function bind(m) {
    m.addEventListener('touchstart', function () { holdOn(m); }, { passive: true });
    m.addEventListener('touchend', function () { holdOff(m); }, { passive: true });
    m.addEventListener('touchcancel', function () { holdOff(m); }, { passive: true });
  }
  for (n = 0; n < marqs.length; n++) { bind(marqs[n]); }

  // 3D tilt (mouse devices only)
  var fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (fine && stage && card) {
    stage.addEventListener('mousemove', function (e) {
      if (rmq && rmq.matches) { return; }
      var r = stage.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      var tf = 'rotateY(' + (px * 12).toFixed(2) + 'deg) rotateX(' + (-py * 10).toFixed(2) + 'deg)';
      card.style.webkitTransform = tf;
      card.style.transform = tf;
    });
    stage.addEventListener('mouseleave', function () {
      card.style.webkitTransform = '';
      card.style.transform = '';
    });
  }
})();
</script>
