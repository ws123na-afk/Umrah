<!-- LOCATION SECTION (fragment). Self-contained: markup + one style + one script. No external requests. -->
<section class="loc-section" id="loc-root" dir="rtl" lang="ur" aria-labelledby="loc-title">
<style>
.loc-section{
  --loc-night:#04201A; --loc-em:#0E4B3B; --loc-gold:#C9A24B; --loc-gold2:#E9CF8B; --loc-gold3:#F2DC9C; --loc-ivory:#F7F1E3;
  --loc-deep:#03150F;
  position:relative; direction:rtl; text-align:start; box-sizing:border-box;
  width:100%; max-width:100%; padding:20px 0 28px; overflow:hidden;
  font-family:"Naskh","Noto Naskh Arabic",serif; color:var(--loc-ivory);
  -webkit-text-size-adjust:100%;
}
.loc-section *,.loc-section *:before,.loc-section *:after{box-sizing:border-box}
.loc-inner{position:relative;max-width:760px;margin:0 auto}

/* heading */
.loc-head{display:grid;grid-template-columns:1fr auto 1fr;column-gap:14px;align-items:center;margin:0 0 10px}
.loc-hl{height:1px;position:relative}
.loc-hl-a{background:linear-gradient(270deg,rgba(201,162,75,0),#C9A24B)}
.loc-hl-b{background:linear-gradient(90deg,rgba(201,162,75,0),#C9A24B)}
.loc-hl:after{content:"";position:absolute;top:-3px;width:7px;height:7px;background:#C9A24B;transform:rotate(45deg)}
.loc-hl-a:after{left:0}
.loc-hl-b:after{right:0}
.loc-title{
  margin:0;padding:6px 4px;font-family:"Nastaliq","Noto Nastaliq Urdu",serif;font-weight:700;
  font-size:2.5rem;line-height:2.3;color:var(--loc-gold2);text-align:center;
  text-shadow:0 0 24px rgba(233,207,139,.28);
}

/* one card: map on top, details below */
.loc-card{
  position:relative;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,#062C23 0%,#04201A 100%);
  border:1px solid rgba(201,162,75,.5);
  box-shadow:0 22px 50px rgba(0,0,0,.45),0 0 0 6px rgba(201,162,75,.06);
}
.loc-card:before{content:"";position:absolute;z-index:3;left:28px;right:28px;top:0;height:2px;pointer-events:none;background:linear-gradient(90deg,rgba(233,207,139,0),#F2DC9C,rgba(233,207,139,0))}

/* map stage */
.loc-stage{
  position:relative;width:100%;height:0;padding-bottom:76%;overflow:hidden;
  perspective:950px;perspective-origin:50% 36%;
  background:radial-gradient(ellipse at 50% 55%,rgba(17,96,74,.7) 0%,rgba(4,32,26,.95) 58%,#03150F 100%);
  touch-action:pan-y;-webkit-tap-highlight-color:transparent;cursor:grab;
  -webkit-user-select:none;user-select:none;
}
.loc-stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;pointer-events:none;background:linear-gradient(180deg,rgba(4,32,26,0),#04201A)}
.loc-tilt{
  position:absolute;left:50%;top:50%;width:84%;height:0;padding-bottom:84%;
  transform-style:preserve-3d;
  transform:translate(-50%,-50%) rotateX(50deg) rotateZ(-4deg);
  will-change:transform;
}
.loc-slab{
  position:absolute;left:0;top:0;width:100%;height:100%;border-radius:28px;
  background:#02100c;border:2px solid rgba(201,162,75,.55);
  transform:translateZ(-18px);box-shadow:0 40px 60px rgba(0,0,0,.55);
}
.loc-plane{
  position:absolute;left:0;top:0;width:100%;height:100%;border-radius:26px;overflow:hidden;
  box-shadow:0 0 0 2px rgba(201,162,75,.7), inset 0 0 40px rgba(0,0,0,.45);
}
.loc-svg{display:block;width:100%;height:100%}
.loc-svg text{font-family:"Nastaliq","Noto Nastaliq Urdu",serif;font-weight:700;fill:#F7F1E3;paint-order:stroke fill;stroke:#06291F;stroke-width:6px;stroke-linejoin:round}
.loc-svg .loc-t-gold{fill:#E9CF8B}
.loc-route-glow{animation:loc-glow 2.4s ease-in-out infinite}
.loc-route{animation:loc-dash 1.1s linear infinite}

/* ground pulse rings + shadow (flat, inside plane) */
.loc-ring{
  position:absolute;left:69.5%;top:40%;width:26%;height:0;padding-bottom:26%;margin-left:-13%;margin-top:-13%;
  border-radius:50%;border:2px solid #E9CF8B;opacity:0;transform:scale(.15);
  animation:loc-pulse 3s ease-out infinite;
}
.loc-ring-2{animation-delay:1s}
.loc-ring-3{animation-delay:2s}
.loc-shadow{
  position:absolute;left:69.5%;top:40%;width:9%;height:0;padding-bottom:9%;margin-left:-4.5%;margin-top:-4.5%;
  border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 70%);
  animation:loc-shadow 1.8s ease-in-out infinite;
}

/* standing pin */
.loc-pinpos{position:absolute;left:69.5%;top:40%;width:0;height:0;transform-style:preserve-3d;transform:translateZ(2px)}
.loc-pinbb{
  position:absolute;left:-23px;bottom:0;width:46px;height:68px;
  transform-origin:50% 100%;transform:rotateZ(4deg) rotateX(-50deg);
}
.loc-pinbounce{width:100%;height:100%;animation:loc-bounce 1.8s ease-in-out infinite}
.loc-pinbounce svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}

/* map overlays (corners only, nothing over the map labels) */
.loc-compass{
  position:absolute;z-index:2;top:12px;left:12px;width:40px;height:40px;border-radius:50%;
  background:rgba(4,32,26,.85);border:1px solid rgba(201,162,75,.55);pointer-events:none;
}
.loc-compass svg{display:block;width:100%;height:100%}
.loc-caption{display:inline-flex;align-items:center;gap:6px;margin:0;padding:0 4px;min-height:44px;font-size:.82rem;line-height:1.8;color:rgba(247,241,227,.7)}
.loc-caption svg{flex:0 0 auto;width:14px;height:14px}

/* details */
.loc-body{position:relative;padding:2px 14px 14px}
.loc-namewrap{text-align:center;margin:0 0 6px}
.loc-hall{margin:0;font-family:"Nastaliq","Noto Nastaliq Urdu",serif;font-weight:700;font-size:clamp(1.45rem,7.4vw,2.4rem);line-height:2.35;color:var(--loc-gold2);text-shadow:0 0 18px rgba(201,162,75,.22);overflow-wrap:break-word}
.loc-en{margin:-6px 0 0;font-family:"Naskh","Noto Naskh Arabic",Georgia,serif;font-size:.8rem;line-height:1.6;letter-spacing:.12em;text-transform:uppercase;color:rgba(233,207,139,.72)}
html[lang="en"] .loc-en{display:none}
html[lang="en"] .loc-hall{padding:.12em 0 .22em;text-wrap:balance}
.loc-orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px auto 12px;max-width:260px}
.loc-orn i{flex:1 1 auto;height:1px;background:linear-gradient(90deg,rgba(201,162,75,0),rgba(201,162,75,.7))}
.loc-orn i:last-child{transform:scaleX(-1)}
.loc-orn b{width:7px;height:7px;background:#C9A24B;transform:rotate(45deg)}

.loc-addr{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;align-items:start;padding:10px 12px 12px;border-radius:18px;background:rgba(14,75,59,.38);border:1px solid rgba(201,162,75,.24)}
.loc-ico{width:40px;height:40px;border-radius:50%;background:rgba(201,162,75,.14);border:1px solid rgba(201,162,75,.45);display:block;padding:9px;margin-top:4px}
.loc-ico svg{display:block;width:100%;height:100%}
.loc-lab{display:block;font-size:.8rem;line-height:1.8;color:var(--loc-gold);font-weight:600}
.loc-val{display:block;font-size:1.05rem;line-height:1.95;color:var(--loc-ivory);overflow-wrap:break-word}
.loc-chip{
  display:inline-flex;align-items:center;gap:7px;margin-top:6px;padding:2px 12px 2px 10px;border-radius:999px;
  font-size:.85rem;line-height:1.95;font-weight:600;color:var(--loc-gold3);
  background:rgba(201,162,75,.12);border:1px solid rgba(201,162,75,.5);max-width:100%;
}
.loc-chip svg{flex:0 0 auto;width:15px;height:15px}

/* actions */
.loc-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:14px}
.loc-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:8px 10px;margin:0;
  text-align:center;text-decoration:none;cursor:pointer;border-radius:14px;
  font-family:"Naskh","Noto Naskh Arabic",serif;font-weight:600;font-size:.98rem;line-height:1.6;
  -webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;
  transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease,transform .15s ease;
}
.loc-btn svg{flex:0 0 auto;width:20px;height:20px}
.loc-btn span{min-width:0;text-wrap:balance}
.loc-btn-main{
  grid-column:1 / -1;min-height:56px;font-size:1.1rem;color:#1A1405;border:0;
  background:linear-gradient(180deg,#F2DC9C 0%,#C9A24B 100%);
  box-shadow:0 8px 22px rgba(201,162,75,.3),inset 0 1px 0 rgba(255,255,255,.5);
}
.loc-btn-sec{color:var(--loc-gold2);background:rgba(4,32,26,.6);border:1px solid rgba(201,162,75,.55)}
.loc-btn-sec:hover{background:rgba(14,75,59,.75);border-color:#E9CF8B}
.loc-btn-main:hover{box-shadow:0 10px 26px rgba(201,162,75,.42),inset 0 1px 0 rgba(255,255,255,.6)}
.loc-btn:focus{outline:none}
.loc-btn:focus-visible,.loc-apple:focus-visible{outline:3px solid #F2DC9C;outline-offset:3px}
.loc-btn:active{transform:scale(.98)}
.loc-copy .loc-i-done{display:none}
.loc-copy.is-done .loc-i-copy{display:none}
.loc-copy.is-done .loc-i-done{display:block}
.loc-copy.is-done{border-color:#E9CF8B;background:rgba(14,75,59,.75)}

.loc-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:16px;margin-top:6px}
.loc-apple{
  display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 10px;border-radius:10px;
  font-size:.9rem;line-height:1.8;color:rgba(233,207,139,.9);text-decoration:underline;text-decoration-color:rgba(201,162,75,.45);text-underline-offset:5px;
}
.loc-apple:hover{color:#F2DC9C;text-decoration-color:#F2DC9C}
.loc-apple svg{width:15px;height:15px;flex:0 0 auto}
.loc-status{min-height:1.9em;margin:0;text-align:center;font-size:.92rem;line-height:1.9;color:var(--loc-gold3)}
.loc-status:empty{min-height:0}

@media (min-width:420px){
  .loc-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .loc-body{padding:4px 18px 16px}
}
@media (min-width:600px){
  .loc-section{padding:48px 0 64px}
  .loc-title{font-size:3rem}
  .loc-stage{padding-bottom:56%}
  .loc-tilt{width:60%;padding-bottom:60%;top:50%}
  .loc-pinbb{left:-30px;width:60px;height:88px}
  .loc-compass{top:16px;left:16px;width:44px;height:44px}
  .loc-body{padding:6px 32px 22px}
  .loc-actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .loc-btn-main{grid-column:auto}
  .loc-btn,.loc-btn-main{min-height:58px;font-size:1rem}
}

@keyframes loc-dash{to{stroke-dashoffset:-24}}
@keyframes loc-glow{0%,100%{opacity:.25}50%{opacity:.6}}
@keyframes loc-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
@keyframes loc-shadow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.7);opacity:.55}}
@keyframes loc-pulse{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}

@media (prefers-reduced-motion:reduce){
  .loc-section *,.loc-section *:before,.loc-section *:after{animation:none !important;transition:none !important}
  .loc-ring{opacity:.5;transform:scale(.6)}
  .loc-ring-2,.loc-ring-3,.loc-car{display:none}
  .loc-route-glow{opacity:.4}
  .loc-btn:active{transform:none}
}
</style>
